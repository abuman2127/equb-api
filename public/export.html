<!DOCTYPE html>
<html>
<head>
    <title>Export - Equb Manager</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; display: flex; }

        .sidebar {
            width: 220px; background: #1a2332; color: white; height: 100vh;
            position: fixed; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; }
        .sidebar .logo-icon {
            width: 40px; height: 40px; background: #2c7be5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            color: #c5cdd8; text-decoration: none; font-size: 14px; margin: 2px 10px; border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .topbar h1 { margin: 0; font-size: 20px; color: #1a2332; }
        .topbar button {
            width: auto; background: #d64545; padding: 8px 16px; border: none;
            border-radius: 6px; color: white; cursor: pointer;
        }

        .export-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .export-card {
            background: white; border: 1px solid #e0e4e8; border-radius: 8px;
            padding: 20px; text-align: center;
        }
        .export-card .icon { font-size: 32px; margin-bottom: 10px; }
        .export-card h3 { margin: 0 0 6px; color: #1a2332; }
        .export-card p { font-size: 13px; color: #6b7280; margin: 0 0 16px; }
        .export-card a {
            display: inline-block; background: #1b8a4a; color: white; text-decoration: none;
            padding: 10px 20px; border-radius: 6px; font-size: 14px;
        }
        .export-card a:hover { background: #157038; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

    <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html"><span class="icon">👤</span> Members</a>
            <a href="/payments.html"><span class="icon">💳</span> Payments</a>
            <a href="/daily-collection.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/weekly-collection.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/groups.html"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/reports.html"><span class="icon">📊</span> Reports</a>
            <a href="/export.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="/settings.html"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Export</h1>
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="export-cards">
            <div class="export-card">
                <div class="icon">👤</div>
                <h3>Members</h3>
                <p>Export all active members to Excel</p>
                <a href="/export/members">Download .xlsx</a>
            </div>
            <div class="export-card">
            <div class="icon">💳</div>
            <h3>Payments</h3>
            <p>Export payments for a date range</p>
            <input type="date" id="exp_start" style="width:100%; margin-bottom:6px; padding:6px;">
            <input type="date" id="exp_end" style="width:100%; margin-bottom:10px; padding:6px;">
            <button onclick="exportPayments()" style="background:#1b8a4a; width:100%;">Download .xlsx</button>
        </div>
        </div>
    </div>

<script>
async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    const data = await res.json();
    if (data.role !== 'admin') {
        window.location.href = '/index.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function exportPayments() {
    const start = document.getElementById('exp_start').value;
    const end = document.getElementById('exp_end').value;
    if (!start || !end) {
        alert('Please select both a start and end date');
        return;
    }
    window.location.href = `/export/payments?start_date=${start}&end_date=${end}`;
}
checkAuth();
</script>
</body>
</html>
