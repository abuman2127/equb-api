<!DOCTYPE html>
<html>
<head>
    <title>Payments - Equb Manager</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; display: flex; }

        .sidebar {
            width: 220px; background: #1a2332; color: white; height: 100vh;
            position: fixed; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; }
        .sidebar .logo-icon {
            width: 40px; height: 40px; background: #2c7be5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            color: #c5cdd8; text-decoration: none; font-size: 14px; margin: 2px 10px; border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .topbar h1 { margin: 0; font-size: 20px; color: #1a2332; }
        .topbar .search {
            flex: 1; max-width: 400px; margin: 0 20px; padding: 8px 12px;
            border: 1px solid #d5dae0; border-radius: 6px;
        }
        .topbar button {
            width: auto; background: #d64545; padding: 8px 16px; border: none;
            border-radius: 6px; color: white; cursor: pointer;
        }

        input, select, button { padding: 8px; margin: 4px 0; box-sizing: border-box; }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .msg { color: green; font-size: 14px; }

        .panel {
            background: white; border: 1px solid #e0e4e8; border-radius: 8px;
            padding: 16px; margin-bottom: 30px;
        }
        .panel h2 { margin-top: 0; }

        .status-paid { color: #1b8a4a; background: #e6f7ec; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

        <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html"><span class="icon">👤</span> Members</a>
            <a href="/payments.html" class="active"><span class="icon">💳</span> Payments</a>
            <a href="/index.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/index.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/index.html"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/index.html"><span class="icon">📊</span> Reports</a>
            <a href="/index.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="#"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Payments</h1>
            <input class="search" placeholder="Search payments...">
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="panel">
            <h2>Record Payment</h2>
            <input id="p_member_id" placeholder="Member ID" type="number">
            <input id="p_amount" placeholder="Amount" type="number">
            <select id="p_period">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
            </select>
            <button onclick="addPayment()">Record Payment</button>
            <div id="p_msg" class="msg"></div>
        </div>

        <div class="panel">
            <h2>Recent Payments</h2>
            <table id="recent_table"></table>
        </div>
    </div>

<script>
async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

async function addPayment() {
    const body = {
        member_id: Number(document.getElementById('p_member_id').value),
        amount: Number(document.getElementById('p_amount').value),
        period_type: document.getElementById('p_period').value
    };
    const res = await fetch('/payments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const data = await res.json();
    document.getElementById('p_msg').innerText = 'Payment recorded: ' + data.amount + ' for member ' + data.member_id;
    loadRecent();
}

async function loadRecent() {
    const res = await fetch('/payments/recent');
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>Member</th><th>Amount</th><th>Type</th><th>Time</th><th>Status</th></tr>';
    data.forEach(p => {
        const time = new Date(p.paid_at).toLocaleString();
        html += `<tr>
            <td>${p.full_name}</td>
            <td>${Number(p.amount).toLocaleString()} Birr</td>
            <td>${p.period_type}</td>
            <td>${time}</td>
            <td><span class="status-paid">${p.status}</span></td>
        </tr>`;
    });
    document.getElementById('recent_table').innerHTML = html;
}

(async () => {
    const ok = await checkAuth();
    if (ok) loadRecent();
})();
</script>
</body>
</html>
