<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - Equb Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --sidebar: #ffffff;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --icon-blue-bg: #dbeafe;
            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        body.dark {
            --bg: #12161f;
            --card: #1a2332;
            --sidebar: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --icon-blue-bg: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: var(--transition); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        .sidebar { width: 260px; background-color: var(--sidebar); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .brand { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-text { font-weight: 700; font-size: 16px; color: var(--text); }
        .section-label { padding: 24px 24px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: var(--transition); }
        .menu-item i { width: 20px; text-align: center; font-size: 16px; }
        .menu-item:hover { background-color: var(--bg); color: var(--text); }
        .menu-item.active { background-color: var(--icon-blue-bg); color: var(--primary-dark); font-weight: 600; }

        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }

        .header { height: 72px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .search-bar { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--radius-sm); width: 300px; transition: var(--transition); }
        .search-bar i { color: var(--text-muted); }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--text); }
        
        .header-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
        .btn-action { border: none; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: var(--transition); }
        .btn-action:hover { filter: brightness(0.95); }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: none; }
        body.dark .btn-logout { background: #7f1d1d; color: #fca5a5; }

        .container { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px;}
        .panel-header h2 { margin: 0; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        
        /* Form Grids */
        .add-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; align-items: end;}
        select, .form-input { background: var(--bg); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; width: 100%; }
        input[type="date"] { color-scheme: light dark; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); height: 40px;}
        .btn-primary:hover { background: var(--primary-dark); }
        .msg { font-size: 14px; font-weight: 500; color: var(--success); margin-top: 12px; }

        /* Tables */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        td { font-size: 14px; font-weight: 500; color: var(--text); }
        
        .status-paid { background: var(--success-bg); color: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        
        .btn-edit { background: var(--icon-blue-bg); color: var(--primary-dark); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; }
        .btn-edit:hover { background: var(--primary); color: white; }
        .btn-delete { background: var(--danger-bg); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .toolbar { display: flex; align-items: center; gap: 12px; background: var(--bg); padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); width: max-content; }
        .toolbar label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        /* ================================================== */
        /* MOBILE RESPONSIVE PATCH */
        /* ================================================== */
        .mobile-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 0; margin-right: 12px; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 95; backdrop-filter: blur(2px); }
        .sidebar-overlay.show { display: block; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 16px !important; width: 100%; }
            .mobile-toggle { display: inline-block; }
            
            .header { flex-direction: column; align-items: flex-start; gap: 16px; height: auto !important; padding: 16px !important; }
            .header-left, .header-right { width: 100%; justify-content: flex-start; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;}
            .header-left { display: flex; align-items: center; }
            .search-bar { width: 100% !important; flex: 1; }
            
            .toolbar, .filter-group { flex-direction: column; align-items: stretch !important; gap: 12px; width: 100%;}
            select, .form-input, input[type="date"] { width: 100% !important; min-width: unset; }
            .add-form-grid { grid-template-columns: 1fr; gap: 12px;}
            .btn-primary, .btn-logout, .btn-action { width: 100%; text-align: center; justify-content: center; display: flex; }
        }
    </style>
</head>
<body>

    <!-- OVERLAY FOR MOBILE -->
    <div class="sidebar-overlay" id="sidebar_overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">EQUB MGT</div>
        </div>

        <div class="section-label">MAIN</div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/members.html" class="menu-item"><i class="fa-solid fa-users"></i> Members</a>
            <a href="/payments.html" class="menu-item active"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="/daily-collection.html" class="menu-item"><i class="fa-solid fa-calendar-day"></i> Daily Collection</a>
            <a href="/weekly-collection.html" class="menu-item"><i class="fa-solid fa-calendar-week"></i> Weekly Collection</a>
            <a href="/groups.html" class="menu-item"><i class="fa-solid fa-users-rectangle"></i> Groups (Equb)</a>
            <a href="/winners.html" class="menu-item"><i class="fa-solid fa-trophy"></i> Payouts (Winners)</a>
            <a href="/reports.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            <a href="/export.html" class="menu-item"><i class="fa-solid fa-file-export"></i> Export</a>
        </div>
        
        <div class="section-label">OTHERS</div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="/settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="header-left">
                <!-- HAMBURGER ICON -->
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search_box" placeholder="Search payments..." oninput="filterPayments()">
                </div>
            </div>
            <div class="header-right">
                <button class="btn-action" onclick="toggleCalendar()" id="cal_toggle"><i class="fa-solid fa-calendar"></i> GC Mode</button>
                <button class="btn-action" onclick="toggleDarkMode()" id="dark_toggle">🌙 Dark Mode</button>
                <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </header>

        <div class="container">
            <h1 class="page-title">Manage Payments</h1>

            <!-- Record Payment Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-money-bill-wave" style="color: var(--success);"></i> Record New Payment</h2>
                </div>
                
                <div class="add-form-grid">
                    <div>
                        <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Group</label>
                        <select id="p_group" onchange="loadGroupMembers()" class="form-input"></select>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Member</label>
                        <select id="p_member_select" class="form-input">
                            <option value="">Select a Group First</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Amount</label>
                        <input id="p_amount" placeholder="Amount (Birr)" type="number" class="form-input">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Period</label>
                        <select id="p_period" class="form-input">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                    </div>
                    
                    <!-- NEW EC/GC TOGGLE DATE FIELD -->
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <label style="font-size:12px; font-weight:600; color:var(--text-muted);">Date (<span id="date_mode_label">GC</span>)</label>
                            <button type="button" onclick="toggleInputCalendarMode(event)" style="background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; padding: 0;">Switch to EC</button>
                        </div>
                        
                        <!-- Standard GC Date Picker -->
                        <input id="p_date_gc" type="date" class="form-input" onchange="syncDates()">
                        
                        <!-- Ethiopian Calendar Inputs (Hidden by default) -->
                        <div id="ec_inputs_wrapper" style="display: none; gap: 4px; grid-template-columns: 1fr 1fr 1fr;">
                            <select id="ec_year" class="form-input" style="padding: 10px 4px;" onchange="syncEcToGc()">
                                <option value="2018">2018</option>
                                <option value="2019" selected>2019</option>
                                <option value="2020">2020</option>
                            </select>
                            <select id="ec_month" class="form-input" style="padding: 10px 4px;" onchange="syncEcToGc()">
                                <option value="1">Meskerem</option>
                                <option value="2">Tikimt</option>
                                <option value="3">Hidar</option>
                                <option value="4">Tahsas</option>
                                <option value="5">Tir</option>
                                <option value="6">Yekatit</option>
                                <option value="7">Megabit</option>
                                <option value="8">Miazia</option>
                                <option value="9">Ginbot</option>
                                <option value="10">Sene</option>
                                <option value="11">Hamle</option>
                                <option value="12">Nehase</option>
                                <option value="13">Pagume</option>
                            </select>
                            <select id="ec_day" class="form-input" style="padding: 10px 4px;" onchange="syncEcToGc()">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        
                        <!-- Hidden input that sends the date to the backend -->
                        <input type="hidden" id="p_date">
                    </div>

                    <button class="btn-primary" onclick="addPayment()">
                        <i class="fa-solid fa-check"></i> Record
                    </button>
                </div>
                <div id="p_msg" class="msg"></div>
            </div>

            <!-- Recent Payments Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-clock-rotate-left" style="color: var(--primary);"></i> Recent Payments</h2>
                    
                    <div class="toolbar">
                        <label><i class="fa-solid fa-filter"></i> Filter:</label>
                        <select id="filter_group" onchange="loadRecent()" style="min-width: 150px; padding: 6px 10px;">
                            <option value="">All Groups</option>
                        </select>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="recent_table">
                        <!-- Populated by JS -->
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// ==========================================
// MOBILE MENU TOGGLE
// ==========================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebar_overlay').classList.toggle('show');
}

// ==========================================
// DATE INPUT TOGGLE (GC / EC)
// ==========================================
let inputMode = 'GC';

function toggleInputCalendarMode(event) {
    inputMode = inputMode === 'GC' ? 'EC' : 'GC';
    document.getElementById('date_mode_label').innerText = inputMode;
    event.target.innerText = inputMode === 'GC' ? 'Switch to EC' : 'Switch to GC';
    
    if (inputMode === 'EC') {
        document.getElementById('p_date_gc').style.display = 'none';
        document.getElementById('ec_inputs_wrapper').style.display = 'grid';
        populateEcDays();
        
        // Auto-select current EC date
        const d = new Date();
        const ecDate = gregorianToEthiopian(d);
        
        // Set year dropdown if exists, otherwise create option
        let yOpt = document.querySelector(`#ec_year option[value="${ecDate.year}"]`);
        if (!yOpt) {
            document.getElementById('ec_year').innerHTML += `<option value="${ecDate.year}">${ecDate.year}</option>`;
        }
        document.getElementById('ec_year').value = ecDate.year;
        document.getElementById('ec_month').value = ecDate.month;
        document.getElementById('ec_day').value = ecDate.day;

        syncEcToGc();
    } else {
        document.getElementById('p_date_gc').style.display = 'block';
        document.getElementById('ec_inputs_wrapper').style.display = 'none';
        syncDates();
    }
}

function populateEcDays() {
    const daySelect = document.getElementById('ec_day');
    let opts = '';
    for(let i=1; i<=30; i++) {
        opts += `<option value="${i}">${i}</option>`;
    }
    daySelect.innerHTML = opts;
}

// Convert Ethiopian dropdowns to Gregorian and store it in hidden #p_date
function syncEcToGc() {
    const eYear = parseInt(document.getElementById('ec_year').value);
    const eMonth = parseInt(document.getElementById('ec_month').value);
    const eDay = parseInt(document.getElementById('ec_day').value);
    
    // Approximate conversion back to Gregorian for backend storage
    let gYear = eYear + 7;
    if (eMonth < 1 || (eMonth === 1 && eDay < 11)) {
        gYear = eYear + 8;
    }
    
    // Simplified mapping estimation for backend compatibility
    const approxMonth = ((eMonth + 8) % 12) + 1;
    const gDate = new Date(Date.UTC(gYear, approxMonth - 1, eDay));
    document.getElementById('p_date').value = gDate.toISOString().split('T')[0];
}

function syncDates() {
    document.getElementById('p_date').value = document.getElementById('p_date_gc').value;
}

// --- Ethiopian Calendar Logic ---
const ETHIOPIAN_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];
function gregorianToEthiopian(gDate) {
    const jdn = Math.floor((gDate.getTime() / 86400000) + 2440587.5 + 0.5);
    const ethEpoch = 1723856;
    const r = (jdn - ethEpoch) % 1461;
    const n = (r % 365) + 365 * Math.floor(r / 1460);
    const eYear = 4 * Math.floor((jdn - ethEpoch) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
    const eMonth = Math.floor(n / 30) + 1;
    const eDay = (n % 30) + 1;
    return { year: eYear, month: eMonth, day: eDay, monthName: ETHIOPIAN_MONTHS[eMonth - 1] };
}
function formatEthiopian(gDateString) {
    if(!gDateString) return '-';
    const d = new Date(gDateString);
    const e = gregorianToEthiopian(d);
    return `${e.day} ${e.monthName} ${e.year}`;
} 
function toggleCalendar() {
    const current = localStorage.getItem('calendarType') || 'GC';
    localStorage.setItem('calendarType', current === 'GC' ? 'EC' : 'GC');
    location.reload(); 
}
function getCalendarType() { return localStorage.getItem('calendarType') || 'GC'; }
function formatDate(gDateString) {
    if(!gDateString) return '-';
    if (getCalendarType() === 'EC') return formatEthiopian(gDateString);
    return new Date(gDateString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
}

// --- Theme Logic ---
function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark_toggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function loadPreferences() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('dark_toggle').innerText = '☀️ Light Mode';
    }
    const calType = getCalendarType();
    document.getElementById('cal_toggle').innerHTML = calType === 'EC' ? '<i class="fa-solid fa-calendar"></i> EC Mode' : '<i class="fa-solid fa-calendar"></i> GC Mode';
    
    // Set today's date in GC format in the date picker automatically
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('p_date_gc').value = today;
    document.getElementById('p_date').value = today; // Initialize hidden input
}

// --- Search Filter Logic ---
function filterPayments() {
    const query = document.getElementById('search_box').value.toLowerCase();
    const rows = document.querySelectorAll('#recent_table tr');
    rows.forEach((row, index) => {
        if (index === 0) return;
        const nameCell = row.cells[1];
        if (!nameCell) return;
        row.style.display = nameCell.innerText.toLowerCase().includes(query) ? '' : 'none';
    });
}

// --- Backend API Logic ---
async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) { window.location.href = '/login.html'; return false; }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

async function loadGroupOptions() {
    const res = await fetch('/groups');
    if (!res.ok) return;
    const groups = await res.json();
    const pGroup = document.getElementById('p_group');
    const filterGroup = document.getElementById('filter_group');
    
    pGroup.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    filterGroup.innerHTML = '<option value="">All Groups</option>' + groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    
    if (groups.length > 0) loadGroupMembers();
}

async function loadGroupMembers() {
    const groupId = document.getElementById('p_group').value;
    const select = document.getElementById('p_member_select');
    if (!groupId) {
        select.innerHTML = '<option value="">No group selected</option>';
        return;
    }
    const res = await fetch('/members/by-group/' + groupId);
    if (!res.ok) return;
    const members = await res.json();
    select.innerHTML = members.map(m =>
        `<option value="${m.id}">${m.group_member_no ? '#' + m.group_member_no + ' - ' : ''}${m.full_name}</option>`
    ).join('');
}

async function addPayment() {
    const memberSelect = document.getElementById('p_member_select').value;
    const amountInput = document.getElementById('p_amount').value;
    
    if(!memberSelect) return alert("Please select a member");
    if(!amountInput) return alert("Please enter an amount");

    // Important: We read from the hidden #p_date which holds the standardized GC date
    const body = {
        member_id: Number(memberSelect),
        amount: Number(amountInput),
        period_type: document.getElementById('p_period').value,
        paid_at: document.getElementById('p_date').value || undefined
    };
    
    const res = await fetch('/payments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    
    const data = await res.json();
    const msgDiv = document.getElementById('p_msg');
    
    if (res.ok) {
        msgDiv.style.color = 'var(--success)';
        msgDiv.innerHTML = `<i class="fa-solid fa-circle-check"></i> Payment recorded: ${data.amount} Birr`;
        document.getElementById('p_amount').value = ''; 
        loadRecent();
    } else {
        msgDiv.style.color = 'var(--danger)';
        msgDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${data.error}`;
    }
    setTimeout(() => msgDiv.innerHTML = '', 4000);
}

async function loadRecent() {
    const groupId = document.getElementById('filter_group').value;
    const url = groupId ? `/payments/recent?group_id=${groupId}` : '/payments/recent';
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>No.</th><th>Member Name</th><th>Group</th><th>Amount</th><th>Type</th><th>Date & Time</th><th>Status</th><th>Action</th></tr>';
    
    if (data.length === 0) {
        html += `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">No recent payments found.</td></tr>`;
    } else {
        data.forEach(p => {
            const time = formatDate(p.paid_at); 
            html += `<tr>
                <td style="color: var(--text-muted); font-weight:600;">${p.member_id}</td>
                <td style="font-weight: 600;"><a href="/members.html" style="color: var(--primary); text-decoration: underline;">${p.full_name}</a></td>
                <td style="color: var(--text-muted);">${p.group_name || '-'}</td>
                <td style="color: var(--success); font-weight: 700;">${Number(p.amount).toLocaleString()} Birr</td>
                <td><span style="background: var(--bg); padding:4px 8px; border-radius:6px; font-size:12px; border:1px solid var(--border);">${p.period_type}</span></td>
                <td style="color: var(--text-muted); font-size:13px;">${time}</td>
                <td><span class="status-paid"><i class="fa-solid fa-check"></i> ${p.status}</span></td>
                <td>
                    <button class="btn-edit" onclick="editPayment(${p.id}, ${p.amount})"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-delete" onclick="deletePayment(${p.id})"><i class="fa-solid fa-trash-can"></i> Del</button>
                </td>
            </tr>`;
        });
    }
    document.getElementById('recent_table').innerHTML = html;
}

async function editPayment(id, currentAmount) {
    const newAmount = prompt('Enter corrected amount:', currentAmount);
    if (newAmount === null) return;
    const res = await fetch('/payments/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ amount: Number(newAmount), period_type: 'daily' })
    });
    if (res.ok) loadRecent();
    else alert('Failed to update payment');
}

async function deletePayment(id) {
    if (!confirm('Delete this payment record? This cannot be undone.')) return;
    const res = await fetch('/payments/' + id, { method: 'DELETE' });
    if (res.ok) loadRecent();
    else alert('Failed to delete payment');
}

(async () => {
    loadPreferences();
    if (await checkAuth()) {
        await loadGroupOptions();
        loadRecent();
    }
})();
</script>
