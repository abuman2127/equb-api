<!DOCTYPE html>
<html>
<head>
    <title>Reports - Equb Manager</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7280;
            --border: #e0e4e8;
            --tab-bg: #e6e9ee;
            --table-header-bg: #f0f2f5;
            --total-row-bg: #d9e8fb;
            --total-row-text: #1a2332;
        }
        body.dark {
            --bg: #12161f;
            --card-bg: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --tab-bg: #2a3547;
            --table-header-bg: #243044;
            --total-row-bg: #1e3a5f;
            --total-row-text: #ffffff;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text);
            display: flex; 
            transition: background 0.2s, color 0.2s;
        }

        .sidebar {
            width: 220px; background: #1a2332; color: white; height: 100vh;
            position: fixed; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; }
        .sidebar .logo-icon {
            width: 40px; height: 40px; background: #2c7be5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            color: #c5cdd8; text-decoration: none; font-size: 14px; margin: 2px 10px; border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .topbar h1 { margin: 0; font-size: 20px; color: var(--text); }
        .topbar button {
            width: auto; background: #d64545; padding: 8px 16px; border: none;
            border-radius: 6px; color: white; cursor: pointer;
        }

        input, select, button { 
            padding: 8px; 
            margin: 4px 0; 
            box-sizing: border-box; 
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
        }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid var(--border); padding: 8px; text-align: left; color: var(--text); }

        .panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 30px; 
        }
        .panel h2 { margin-top: 0; }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tabs button { width: auto; background: var(--tab-bg); color: var(--text); padding: 8px 16px; }
        .tabs button.active { background: #2c7be5; color: white; }

        .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
        .controls input, .controls select { width: auto; }

        #g_table { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 13px; }
        #g_table th, #g_table td { border: 1px solid var(--border); padding: 4px 10px; text-align: right; white-space: nowrap; color: var(--text); }
        #g_table th { background: var(--table-header-bg); font-weight: bold; text-align: center; }
        #g_table td:first-child, #g_table th:first-child { text-align: left; font-weight: bold; background: var(--table-header-bg); }
        #g_table tr:last-child td { background: var(--total-row-bg); color: var(--total-row-text); font-weight: bold; border-top: 2px solid #2c7be5; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

        <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html"><span class="icon">👤</span> Members</a>
            <a href="/payments.html"><span class="icon">💳</span> Payments</a>
            <a href="/daily-collection.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/weekly-collection.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/groups.html"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/reports.html" class="active"><span class="icon">📊</span> Reports</a>
            <a href="/export.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="/settings.html"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Reports</h1>
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="panel">
            <div class="tabs">
                <button id="tab_daily" class="active" onclick="switchTab('daily')">Daily</button>
                <button id="tab_weekly" onclick="switchTab('weekly')">Weekly</button>
                <button id="tab_monthly" onclick="switchTab('monthly')">Monthly</button>
                <button id="tab_grid" onclick="switchTab('grid')">Payment Grid</button>
            </div>

            <div id="controls_daily" class="controls">
                <input id="daily_date" type="date">
                <button onclick="getDaily()">Get Report</button>
            </div>
            <div id="controls_weekly" class="controls" style="display:none;">
                <input id="weekly_year" type="number" placeholder="Year" style="width:100px;">
                <input id="weekly_week" type="number" placeholder="Week #" style="width:100px;">
                <button onclick="getWeekly()">Get Report</button>
            </div>
            <div id="controls_monthly" class="controls" style="display:none;">
                <input id="monthly_year" type="number" placeholder="Year" style="width:100px;">
                <input id="monthly_month" type="number" placeholder="Month (1-12)" style="width:120px;">
                <button onclick="getMonthly()">Get Report</button>
            </div>
            <div id="controls_grid" class="controls" style="display:none;">
                <input id="g_start" type="date">
                <input id="g_end" type="date">
                <button onclick="getGrid()">Load Grid</button>
            </div>

            <div id="view_daily"><table id="r_table"></table></div>
            <div id="view_grid" style="display:none; overflow-x:auto; max-height:500px; overflow-y:auto;">
                <table id="g_table"></table>
            </div>
        </div>
    </div>

<script>
function loadDarkModePreference() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }
}

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    const data = await res.json();
    if (data.role !== 'admin') {
        window.location.href = '/index.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function switchTab(tab) {
    ['daily', 'weekly', 'monthly', 'grid'].forEach(t => {
        document.getElementById('tab_' + t).classList.toggle('active', t === tab);
        document.getElementById('controls_' + t).style.display = t === tab ? 'flex' : 'none';
    });
    document.getElementById('view_daily').style.display = (tab === 'grid') ? 'none' : 'block';
    document.getElementById('view_grid').style.display = (tab === 'grid') ? 'block' : 'none';
}

function renderTable(data) {
    let html = '<tr><th>Name</th><th>Total</th><th>Payments</th></tr>';
    data.forEach(row => {
        html += `<tr><td>${row.full_name}</td><td>${Number(row.total).toLocaleString()} Birr</td><td>${row.payment_count}</td></tr>`;
    });
    document.getElementById('r_table').innerHTML = html;
}

async function getDaily() {
    const date = document.getElementById('daily_date').value;
    const res = await fetch('/reports/daily?date=' + date);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getWeekly() {
    const year = document.getElementById('weekly_year').value;
    const week = document.getElementById('weekly_week').value;
    const res = await fetch(`/reports/weekly?year=${year}&week=${week}`);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getMonthly() {
    const year = document.getElementById('monthly_year').value;
    const month = document.getElementById('monthly_month').value;
    const res = await fetch(`/reports/monthly?year=${year}&month=${month}`);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getGrid() {
    const start = document.getElementById('g_start').value;
    const end = document.getElementById('g_end').value;
    const res = await fetch(`/reports/grid?start_date=${start}&end_date=${end}`);
    if (!res.ok) return;
    const data = await res.json();

    const dates = [];
    let d = new Date(start);
    const endD = new Date(end);
    while (d <= endD) {
        dates.push(d.toISOString().split('T')[0]);
        d.setDate(d.getDate() + 1);
    }

    let html = '<tr><th>Name</th>' + dates.map(dt => `<th>${dt}</th>`).join('') + '</tr>';
    const totals = {};
    dates.forEach(dt => totals[dt] = 0);

    data.members.forEach(m => {
        html += `<tr><td>${m.full_name}</td>`;
        dates.forEach(dt => {
            const amt = (data.payments[m.id] && data.payments[m.id][dt]) || 0;
            totals[dt] += amt;
            html += `<td>${amt}</td>`;
        });
        html += '</tr>';
    });

    html += '<tr><td>Total</td>' + dates.map(dt => `<td>${totals[dt]}</td>`).join('') + '</tr>';
    document.getElementById('g_table').innerHTML = html;
}

(async () => {
    loadDarkModePreference();
    await checkAuth();
    document.getElementById('daily_date').value = new Date().toISOString().split('T')[0];
})();
</script>
</body>
</html>
