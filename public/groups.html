<!DOCTYPE html>
<html>
<head>
    <title>Groups - Equb Manager</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7280;
            --border: #e0e4e8;
        }
        body.dark {
            --bg: #12161f;
            --card-bg: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text);
            display: flex; 
            transition: background 0.2s, color 0.2s;
        }

        .sidebar {
            width: 220px; background: #1a2332; color: white; height: 100vh;
            position: fixed; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; }
        .sidebar .logo-icon {
            width: 40px; height: 40px; background: #2c7be5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            color: #c5cdd8; text-decoration: none; font-size: 14px; margin: 2px 10px; border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .topbar h1 { margin: 0; font-size: 20px; color: var(--text); }
        .topbar button {
            width: auto; background: #d64545; padding: 8px 16px; border: none;
            border-radius: 6px; color: white; cursor: pointer;
        }

        input, select, button { 
            padding: 8px; 
            margin: 4px 0; 
            box-sizing: border-box; 
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
        }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid var(--border); padding: 8px; text-align: left; color: var(--text); }
        .msg { color: #1b8a4a; font-size: 14px; }

        .panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 30px; 
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; }
        .panel-header button { background: #1e2a3a; padding: 8px 16px; width: auto; color: white; }

        .badge { background: rgba(128,128,128,0.15); color: var(--text); padding: 3px 10px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

        <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html"><span class="icon">👤</span> Members</a>
            <a href="/payments.html"><span class="icon">💳</span> Payments</a>
            <a href="/daily-collection.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/weekly-collection.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/groups.html" class="active"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/reports.html"><span class="icon">📊</span> Reports</a>
            <a href="/export.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="/settings.html"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Equb Groups</h1>
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2 style="margin:0;">All Groups</h2>
                <button onclick="toggleAddGroup()">+ New Group</button>
            </div>

            <div id="add_group_form" style="display:none; margin: 12px 0; max-width:400px;">
                <input id="g_name" placeholder="Group name (e.g. Morning Equb)">
                <select id="g_period">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                </select>
                <input id="g_note" placeholder="Note (optional)">
                <button onclick="addGroup()">Save Group</button>
                <div id="g_msg" class="msg"></div>
            </div>

            <table id="groups_table"></table>
        </div>
    </div>

<script>
function loadDarkModePreference() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }
}

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function toggleAddGroup() {
    const form = document.getElementById('add_group_form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function addGroup() {
    const body = {
        name: document.getElementById('g_name').value,
        period_type: document.getElementById('g_period').value,
        contribution_note: document.getElementById('g_note').value
    };
    const res = await fetch('/groups', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    if (res.ok) {
        document.getElementById('g_msg').innerText = 'Group created';
        loadGroups();
    } else {
        const data = await res.json();
        document.getElementById('g_msg').innerText = data.error || 'Failed to create group';
    }
}

async function deleteGroup(id) {
    if (!confirm('Remove this group? Members and history stay, just unlisted.')) return;
    const res = await fetch('/groups/' + id, { method: 'DELETE' });
    if (res.ok) {
        loadGroups();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to remove group');
    }
}

async function loadGroups() {
    const res = await fetch('/groups');
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>Name</th><th>Type</th><th>Members</th><th>Note</th><th>Action</th></tr>';
    data.forEach(g => {
        html += `<tr>
            <td>${g.name}</td>
            <td><span class="badge">${g.period_type}</span></td>
            <td>${g.member_count}</td>
            <td>${g.contribution_note || '-'}</td>
            <td>
                <button onclick="selectWinner(${g.id})" style="width:auto; background:#1b8a4a; padding:4px 10px; font-size:12px;">Select Winner</button>
                <button onclick="deleteGroup(${g.id})" style="width:auto; background:#d64545; padding:4px 10px; font-size:12px;">Remove</button>
            </td>
        </tr>`;
    });
    document.getElementById('groups_table').innerHTML = html;
}

async function selectWinner(groupId) {
    if (!confirm('Randomly select this round\'s winner?')) return;
    const res = await fetch(`/groups/${groupId}/select-winner`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
        alert(`🎉 Winner: ${data.winner}\nRound ${data.round}\nAmount: ${Number(data.amount).toLocaleString()} Birr`);
        loadGroups();
    } else {
        alert(data.error || 'Failed to select winner');
    }
}

(async () => {
    loadDarkModePreference();
    const ok = await checkAuth();
    if (ok) loadGroups();
})();
</script>
</body>
</html>
