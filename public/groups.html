<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Equb Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --sidebar: #ffffff;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --icon-blue-bg: #dbeafe;

            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        body.dark {
            --bg: #12161f;
            --card: #1a2332;
            --sidebar: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --icon-blue-bg: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }

        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: var(--transition); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        .sidebar { width: 260px; background-color: var(--sidebar); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; }
        .brand { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-text { font-weight: 700; font-size: 16px; color: var(--text); }
        .section-label { padding: 24px 24px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: var(--transition); }
        .menu-item i { width: 20px; text-align: center; font-size: 16px; }
        .menu-item:hover { background-color: var(--bg); color: var(--text); }
        .menu-item.active { background-color: var(--icon-blue-bg); color: var(--primary-dark); font-weight: 600; }

        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }

        .header { height: 72px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
        
        .header-right { display: flex; align-items: center; gap: 12px; margin-left: auto;}
        .btn-action { border: none; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: var(--transition); }
        .btn-action:hover { filter: brightness(0.95); }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: none; }
        body.dark .btn-logout { background: #7f1d1d; color: #fca5a5; }

        .container { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px;}
        .panel-header h2 { margin: 0; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); height: 40px;}
        .btn-primary:hover { background: var(--primary-dark); }

        .add-form { background: var(--bg); padding: 20px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 1px solid var(--border); display: none; }
        .add-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; align-items: end;}
        select, .form-input { background: var(--card); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; width: 100%; }
        .msg { font-size: 14px; font-weight: 500; color: var(--success); margin-top: 12px; }

        /* Tables */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        td { font-size: 14px; font-weight: 500; color: var(--text); }
        
        .badge { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        
        .btn-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; margin-right: 6px;}
        .btn-success:hover { background: var(--success); color: white; }
        
        .btn-delete { background: var(--danger-bg); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-delete:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">EQUB MGT</div>
        </div>

        <div class="section-label">MAIN</div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/members.html" class="menu-item"><i class="fa-solid fa-users"></i> Members</a>
            <a href="/payments.html" class="menu-item"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="/daily-collection.html" class="menu-item"><i class="fa-solid fa-calendar-day"></i> Daily Collection</a>
            <a href="/weekly-collection.html" class="menu-item"><i class="fa-solid fa-calendar-week"></i> Weekly Collection</a>
            <a href="/groups.html" class="menu-item active"><i class="fa-solid fa-users-rectangle"></i> Groups (Equb)</a>
            <a href="/winners.html" class="menu-item"><i class="fa-solid fa-trophy"></i> Payouts (Winners)</a>
            <a href="/reports.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            <a href="/export.html" class="menu-item"><i class="fa-solid fa-file-export"></i> Export</a>
        </div>

        <div class="section-label">OTHERS</div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="/settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div></div> <!-- Spacer -->
            <div class="header-right">
                <button class="btn-action" onclick="toggleCalendar()" id="cal_toggle"><i class="fa-solid fa-calendar"></i> GC Mode</button>
                <button class="btn-action" onclick="toggleDarkMode()" id="dark_toggle">🌙 Dark Mode</button>
                <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </header>

        <div class="container">
            <h1 class="page-title">Manage Groups</h1>

            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-users-rectangle" style="color: var(--primary);"></i> All Equb Groups</h2>
                    <button class="btn-primary" onclick="toggleAddGroup()">
                        <i class="fa-solid fa-plus"></i> New Group
                    </button>
                </div>

                <div class="add-form" id="add_group_form">
                    <h3 style="margin-bottom: 16px; font-size: 16px; color: var(--text);">Create a New Group</h3>
                    <div class="add-form-grid">
                        <div>
                            <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Group Name</label>
                            <input id="g_name" class="form-input" placeholder="e.g. Morning Equb">
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Period Type</label>
                            <select id="g_period" class="form-input">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Note (Optional)</label>
                            <input id="g_note" class="form-input" placeholder="Rules or notes">
                        </div>
                        <button class="btn-primary" onclick="addGroup()"><i class="fa-solid fa-floppy-disk"></i> Save Group</button>
                    </div>
                    <div id="g_msg" class="msg"></div>
                </div>

                <div class="table-wrapper">
                    <table id="groups_table">
                        <!-- Populated by JS -->
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// --- Ethiopian Calendar Logic ---
function toggleCalendar() {
    const current = localStorage.getItem('calendarType') || 'GC';
    localStorage.setItem('calendarType', current === 'GC' ? 'EC' : 'GC');
    location.reload(); 
}
function getCalendarType() { return localStorage.getItem('calendarType') || 'GC'; }

// --- Theme Logic ---
function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark_toggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function loadPreferences() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('dark_toggle').innerText = '☀️ Light Mode';
    }
    const calType = getCalendarType();
    document.getElementById('cal_toggle').innerHTML = calType === 'EC' ? '<i class="fa-solid fa-calendar"></i> EC Mode' : '<i class="fa-solid fa-calendar"></i> GC Mode';
}

// --- API Logic ---
async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) { window.location.href = '/login.html'; return false; }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function toggleAddGroup() {
    const form = document.getElementById('add_group_form');
    form.style.display = form.style.display === 'none' || form.style.display === '' ? 'block' : 'none';
}

async function addGroup() {
    const body = {
        name: document.getElementById('g_name').value,
        period_type: document.getElementById('g_period').value,
        contribution_note: document.getElementById('g_note').value
    };
    
    if(!body.name) return alert("Please enter a group name");

    const res = await fetch('/groups', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    
    const msgDiv = document.getElementById('g_msg');
    if (res.ok) {
        msgDiv.style.color = 'var(--success)';
        msgDiv.innerHTML = `<i class="fa-solid fa-circle-check"></i> Group created successfully`;
        document.getElementById('g_name').value = '';
        document.getElementById('g_note').value = '';
        loadGroups();
    } else {
        const data = await res.json();
        msgDiv.style.color = 'var(--danger)';
        msgDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${data.error || 'Failed to create group'}`;
    }
    setTimeout(() => msgDiv.innerHTML = '', 3000);
}

async function deleteGroup(id) {
    if (!confirm('Remove this group? Members and history stay, just unlisted.')) return;
    const res = await fetch('/groups/' + id, { method: 'DELETE' });
    if (res.ok) {
        loadGroups();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to remove group');
    }
}

async function loadGroups() {
    const res = await fetch('/groups');
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>Name</th><th>Type</th><th>Members</th><th>Note</th><th>Action</th></tr>';
    
    if (data.length === 0) {
        html += `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted);">No groups created yet.</td></tr>`;
    } else {
        data.forEach(g => {
            html += `<tr>
                <td style="font-weight: 600; color: var(--text);">${g.name}</td>
                <td><span class="badge">${g.period_type}</span></td>
                <td><i class="fa-solid fa-users" style="color:var(--text-muted); margin-right:6px;"></i> ${g.member_count}</td>
                <td style="color: var(--text-muted);">${g.contribution_note || '-'}</td>
                <td>
                    <button class="btn-success" onclick="selectWinner(${g.id})"><i class="fa-solid fa-trophy"></i> Select Winner</button>
                    <button class="btn-delete" onclick="deleteGroup(${g.id})"><i class="fa-solid fa-trash-can"></i> Remove</button>
                </td>
            </tr>`;
        });
    }
    document.getElementById('groups_table').innerHTML = html;
}

async function selectWinner(groupId) {
    if (!confirm('Randomly select this round\'s winner?')) return;
    const res = await fetch(`/groups/${groupId}/select-winner`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
        alert(`🎉 Winner: ${data.winner}\nRound: ${data.round}\nAmount: ${Number(data.amount).toLocaleString()} Birr`);
        loadGroups();
    } else {
        alert(data.error || 'Failed to select winner');
    }
}

(async () => {
    loadPreferences();
    const ok = await checkAuth();
    if (ok) loadGroups();
})();
</script>
</body>
</html>
