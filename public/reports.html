<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Equb Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --sidebar: #ffffff;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --icon-blue-bg: #dbeafe;
            
            --total-row-bg: #eff6ff;
            --total-row-text: #1e3a8a;

            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        body.dark {
            --bg: #12161f;
            --card: #1a2332;
            --sidebar: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --icon-blue-bg: #1e3a8a;
            
            --total-row-bg: #1e3a8a;
            --total-row-text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: var(--transition); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        .sidebar { width: 260px; background-color: var(--sidebar); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; }
        .brand { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-text { font-weight: 700; font-size: 16px; color: var(--text); }
        .section-label { padding: 24px 24px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: var(--transition); }
        .menu-item i { width: 20px; text-align: center; font-size: 16px; }
        .menu-item:hover { background-color: var(--bg); color: var(--text); }
        .menu-item.active { background-color: var(--icon-blue-bg); color: var(--primary-dark); font-weight: 600; }

        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }

        .header { height: 72px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
        
        .header-right { display: flex; align-items: center; gap: 12px; margin-left: auto;}
        .btn-action { border: none; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: var(--transition); }
        .btn-action:hover { filter: brightness(0.95); }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: none; }
        body.dark .btn-logout { background: #7f1d1d; color: #fca5a5; }

        .container { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
        
        /* Modern Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; overflow-x: auto;}
        .tabs button { background: transparent; color: var(--text-muted); border: none; padding: 10px 20px; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: var(--radius-sm); transition: var(--transition); white-space: nowrap; display: flex; align-items: center; gap: 8px;}
        .tabs button:hover { background: var(--bg); color: var(--text); }
        .tabs button.active { background: var(--icon-blue-bg); color: var(--primary-dark); }

        /* Controls Section */
        .controls { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 24px; background: var(--bg); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); flex-wrap: wrap;}
        .controls-group { display: flex; flex-direction: column; gap: 6px; }
        .controls-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        
        input, select { background: var(--card); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; min-width: 140px; color-scheme: light dark;}
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); height: 40px;}
        .btn-primary:hover { background: var(--primary-dark); }

        /* Tables */
        .table-wrapper { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; position: sticky; top: 0; background: var(--card); z-index: 10; box-shadow: 0 1px 0 var(--border);}
        td { font-size: 14px; font-weight: 500; color: var(--text); }
        
        /* Grid specific styles */
        #g_table th, #g_table td { text-align: right; border: 1px solid var(--border); }
        #g_table th { background: var(--bg); text-align: center; }
        #g_table td:first-child, #g_table th:first-child { text-align: left; font-weight: 600; background: var(--bg); position: sticky; left: 0; z-index: 20; box-shadow: 1px 0 0 var(--border);}
        #g_table th:first-child { z-index: 30; }
        #g_table tr:last-child td { background: var(--total-row-bg); color: var(--total-row-text); font-weight: 700; border-top: 2px solid var(--primary); }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">EQUB MGT</div>
        </div>

        <div class="section-label">MAIN</div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/members.html" class="menu-item"><i class="fa-solid fa-users"></i> Members</a>
            <a href="/payments.html" class="menu-item"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="/daily-collection.html" class="menu-item"><i class="fa-solid fa-calendar-day"></i> Daily Collection</a>
            <a href="/weekly-collection.html" class="menu-item"><i class="fa-solid fa-calendar-week"></i> Weekly Collection</a>
            <a href="/groups.html" class="menu-item"><i class="fa-solid fa-users-rectangle"></i> Groups (Equb)</a>
            <a href="/winners.html" class="menu-item"><i class="fa-solid fa-trophy"></i> Payouts (Winners)</a>
            <a href="/reports.html" class="menu-item active"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            <a href="/export.html" class="menu-item"><i class="fa-solid fa-file-export"></i> Export</a>
        </div>

        <div class="section-label">OTHERS</div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="/settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div></div> <!-- Spacer -->
            <div class="header-right">
                <button class="btn-action" onclick="toggleCalendar()" id="cal_toggle"><i class="fa-solid fa-calendar"></i> GC Mode</button>
                <button class="btn-action" onclick="toggleDarkMode()" id="dark_toggle">🌙 Dark Mode</button>
                <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </header>

        <div class="container">
            <h1 class="page-title">Reports & Analytics</h1>

            <div class="panel">
                <div class="tabs">
                    <button id="tab_daily" class="active" onclick="switchTab('daily')"><i class="fa-solid fa-calendar-day"></i> Daily Report</button>
                    <button id="tab_weekly" onclick="switchTab('weekly')"><i class="fa-solid fa-calendar-week"></i> Weekly Report</button>
                    <button id="tab_monthly" onclick="switchTab('monthly')"><i class="fa-solid fa-calendar-days"></i> Monthly Report</button>
                    <button id="tab_grid" onclick="switchTab('grid')"><i class="fa-solid fa-table-cells"></i> Payment Grid</button>
                </div>

                <!-- Daily Controls -->
                <div id="controls_daily" class="controls">
                    <div class="controls-group">
                        <label>Select Date</label>
                        <input id="daily_date" type="date">
                    </div>
                    <button class="btn-primary" onclick="getDaily()"><i class="fa-solid fa-magnifying-glass"></i> Get Report</button>
                </div>

                <!-- Weekly Controls -->
                <div id="controls_weekly" class="controls" style="display:none;">
                    <div class="controls-group">
                        <label>Year</label>
                        <input id="weekly_year" type="number" placeholder="e.g. 2024">
                    </div>
                    <div class="controls-group">
                        <label>Week Number</label>
                        <input id="weekly_week" type="number" placeholder="e.g. 42">
                    </div>
                    <button class="btn-primary" onclick="getWeekly()"><i class="fa-solid fa-magnifying-glass"></i> Get Report</button>
                </div>

                <!-- Monthly Controls -->
                <div id="controls_monthly" class="controls" style="display:none;">
                    <div class="controls-group">
                        <label>Year</label>
                        <input id="monthly_year" type="number" placeholder="e.g. 2024">
                    </div>
                    <div class="controls-group">
                        <label>Month</label>
                        <input id="monthly_month" type="number" placeholder="1-12">
                    </div>
                    <button class="btn-primary" onclick="getMonthly()"><i class="fa-solid fa-magnifying-glass"></i> Get Report</button>
                </div>

                <!-- Grid Controls -->
                <div id="controls_grid" class="controls" style="display:none;">
                    <div class="controls-group">
                        <label>Start Date</label>
                        <input id="g_start" type="date">
                    </div>
                    <div class="controls-group">
                        <label>End Date</label>
                        <input id="g_end" type="date">
                    </div>
                    <button class="btn-primary" onclick="getGrid()"><i class="fa-solid fa-table"></i> Load Grid</button>
                </div>

                <!-- Views -->
                <div id="view_daily" class="table-wrapper">
                    <table id="r_table"></table>
                </div>
                
                <div id="view_grid" class="table-wrapper" style="display:none;">
                    <table id="g_table"></table>
                </div>
            </div>
        </div>
    </div>

<script>
// --- Ethiopian Calendar Logic ---
const ETHIOPIAN_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];
function gregorianToEthiopian(gDate) {
    const jdn = Math.floor((gDate.getTime() / 86400000) + 2440587.5 + 0.5);
    const ethEpoch = 1723856;
    const r = (jdn - ethEpoch) % 1461;
    const n = (r % 365) + 365 * Math.floor(r / 1460);
    const eYear = 4 * Math.floor((jdn - ethEpoch) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
    const eMonth = Math.floor(n / 30) + 1;
    const eDay = (n % 30) + 1;
    return { year: eYear, month: eMonth, day: eDay, monthName: ETHIOPIAN_MONTHS[eMonth - 1] };
}
function formatEthiopian(gDateString) {
    if(!gDateString) return '-';
    const d = new Date(gDateString);
    const e = gregorianToEthiopian(d);
    return `${e.day} ${e.monthName} ${e.year}`;
} 
function toggleCalendar() {
    const current = localStorage.getItem('calendarType') || 'GC';
    localStorage.setItem('calendarType', current === 'GC' ? 'EC' : 'GC');
    location.reload(); 
}
function getCalendarType() { return localStorage.getItem('calendarType') || 'GC'; }
function formatDate(gDateString) {
    if(!gDateString) return '-';
    if (getCalendarType() === 'EC') return formatEthiopian(gDateString);
    return new Date(gDateString).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// --- Theme Logic ---
function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark_toggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function loadPreferences() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('dark_toggle').innerText = '☀️ Light Mode';
    }
    const calType = getCalendarType();
    document.getElementById('cal_toggle').innerHTML = calType === 'EC' ? '<i class="fa-solid fa-calendar"></i> EC Mode' : '<i class="fa-solid fa-calendar"></i> GC Mode';
}

// --- API & Report Logic ---
async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    const data = await res.json();
    if (data.role !== 'admin') {
        window.location.href = '/index.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function switchTab(tab) {
    ['daily', 'weekly', 'monthly', 'grid'].forEach(t => {
        document.getElementById('tab_' + t).classList.toggle('active', t === tab);
        document.getElementById('controls_' + t).style.display = t === tab ? 'flex' : 'none';
    });
    document.getElementById('view_daily').style.display = (tab === 'grid') ? 'none' : 'block';
    document.getElementById('view_grid').style.display = (tab === 'grid') ? 'block' : 'none';
    document.getElementById('r_table').innerHTML = ''; // clear previous
}

function renderTable(data) {
    let html = '<tr><th>Member Name</th><th>Total Collected</th><th>Payment Count</th></tr>';
    
    if(!data || data.length === 0) {
        html += `<tr><td colspan="3" style="text-align:center; padding:30px; color:var(--text-muted);">No records found for this period.</td></tr>`;
    } else {
        data.forEach(row => {
            html += `<tr>
                <td style="font-weight: 600; color: var(--text);">${row.full_name}</td>
                <td style="color: var(--success); font-weight: 700;">${Number(row.total).toLocaleString()} Birr</td>
                <td><span style="background: var(--bg); padding:4px 10px; border-radius:12px; border:1px solid var(--border); font-size:12px;">${row.payment_count} Times</span></td>
            </tr>`;
        });
    }
    document.getElementById('r_table').innerHTML = html;
}

async function getDaily() {
    const date = document.getElementById('daily_date').value;
    if(!date) return alert('Select a date first');
    const res = await fetch('/reports/daily?date=' + date);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getWeekly() {
    const year = document.getElementById('weekly_year').value;
    const week = document.getElementById('weekly_week').value;
    if(!year || !week) return alert('Enter year and week');
    const res = await fetch(`/reports/weekly?year=${year}&week=${week}`);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getMonthly() {
    const year = document.getElementById('monthly_year').value;
    const month = document.getElementById('monthly_month').value;
    if(!year || !month) return alert('Enter year and month');
    const res = await fetch(`/reports/monthly?year=${year}&month=${month}`);
    if (!res.ok) return;
    renderTable(await res.json());
}

async function getGrid() {
    const start = document.getElementById('g_start').value;
    const end = document.getElementById('g_end').value;
    if(!start || !end) return alert('Select start and end dates');
    
    const res = await fetch(`/reports/grid?start_date=${start}&end_date=${end}`);
    if (!res.ok) return;
    const data = await res.json();

    const dates = [];
    let d = new Date(start);
    const endD = new Date(end);
    
    // Safety break to prevent browser crash if range is too large
    if((endD - d) / (1000 * 60 * 60 * 24) > 60) {
        return alert("Please select a date range of 60 days or less.");
    }

    while (d <= endD) {
        dates.push(d.toISOString().split('T')[0]);
        d.setDate(d.getDate() + 1);
    }

    // Use EC/GC converter for table headers!
    let html = '<tr><th>Member Name</th>' + dates.map(dt => `<th>${formatDate(dt)}</th>`).join('') + '</tr>';
    const totals = {};
    dates.forEach(dt => totals[dt] = 0);

    if(data.members.length === 0) {
        html += `<tr><td colspan="${dates.length + 1}" style="text-align:center; padding:30px;">No members found.</td></tr>`;
    } else {
        data.members.forEach(m => {
            html += `<tr><td>${m.full_name}</td>`;
            dates.forEach(dt => {
                const amt = (data.payments[m.id] && data.payments[m.id][dt]) || 0;
                totals[dt] += amt;
                html += amt > 0 ? `<td style="color:var(--success);">${amt}</td>` : `<td style="color:var(--text-muted); opacity:0.5;">-</td>`;
            });
            html += '</tr>';
        });

        // Add bottom totals row
        html += '<tr><td>Overall Total</td>' + dates.map(dt => `<td>${totals[dt].toLocaleString()}</td>`).join('') + '</tr>';
    }

    document.getElementById('g_table').innerHTML = html;
}

(async () => {
    loadPreferences();
    if(await checkAuth()) {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('daily_date').value = today;
        document.getElementById('weekly_year').value = new Date().getFullYear();
        document.getElementById('monthly_year').value = new Date().getFullYear();
    }
})();
</script>
</body>
</html>
