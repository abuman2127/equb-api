<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Equb Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --sidebar: #ffffff;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --icon-blue-bg: #dbeafe;

            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        body.dark {
            --bg: #12161f;
            --card: #1a2332;
            --sidebar: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --icon-blue-bg: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: var(--transition); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        .sidebar { width: 260px; background-color: var(--sidebar); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; }
        .brand { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-text { font-weight: 700; font-size: 16px; color: var(--text); }
        .section-label { padding: 24px 24px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: var(--transition); }
        .menu-item i { width: 20px; text-align: center; font-size: 16px; }
        .menu-item:hover { background-color: var(--bg); color: var(--text); }
        .menu-item.active { background-color: var(--icon-blue-bg); color: var(--primary-dark); font-weight: 600; }

        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }

        .header { height: 72px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .btn-action { border: none; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: var(--transition); }
        .btn-action:hover { filter: brightness(0.95); }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: none; }
        body.dark .btn-logout { background: #7f1d1d; color: #fca5a5; }

        .container { padding: 32px; max-width: 1000px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px;}
        .panel-header h2 { margin: 0; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        
        .pref-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; font-weight: 500;}

        /* Form Inputs */
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .form-input { background: var(--bg); border: 1px solid var(--border); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; width: 100%; font-family: inherit; }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .msg { font-size: 13px; font-weight: 600; color: var(--success); margin-top: 12px; }
        .err { font-size: 13px; font-weight: 600; color: var(--danger); margin-top: 12px; }

        .add-form { background: var(--bg); padding: 20px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 1px solid var(--border); display: none; }

        /* Tables */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        td { font-size: 14px; font-weight: 500; color: var(--text); }
        
        .badge { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-admin { background: var(--icon-blue-bg); color: var(--primary-dark); border-color: transparent;}
        
        .btn-delete { background: var(--danger-bg); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-delete:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">EQUB MGT</div>
        </div>

        <div class="section-label">MAIN</div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/members.html" class="menu-item"><i class="fa-solid fa-users"></i> Members</a>
            <a href="/payments.html" class="menu-item"><i class="fa-solid fa-wallet"></i> Payments</a>
            <a href="/daily-collection.html" class="menu-item"><i class="fa-solid fa-calendar-day"></i> Daily Collection</a>
            <a href="/weekly-collection.html" class="menu-item"><i class="fa-solid fa-calendar-week"></i> Weekly Collection</a>
            <a href="/groups.html" class="menu-item"><i class="fa-solid fa-users-rectangle"></i> Groups (Equb)</a>
            <a href="/winners.html" class="menu-item"><i class="fa-solid fa-trophy"></i> Payouts (Winners)</a>
            <a href="/reports.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            <a href="/export.html" class="menu-item"><i class="fa-solid fa-file-export"></i> Export</a>
        </div>

        <div class="section-label">OTHERS</div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="/settings.html" class="menu-item active"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <div class="header-right">
                <button class="btn-action" onclick="toggleCalendar()" id="cal_toggle"><i class="fa-solid fa-calendar"></i> GC Mode</button>
                <button class="btn-action" onclick="toggleDarkMode()" id="dark_toggle">🌙 Dark Mode</button>
                <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </header>

        <div class="container">
            <h1 class="page-title">Settings</h1>

            <!-- Appearance Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-palette" style="color: var(--primary);"></i> Appearance</h2>
                </div>
                <div class="pref-row">
                    <span>App Theme</span>
                    <button class="btn-action" onclick="toggleDarkMode()" id="dark_toggle_inline">🌙 Switch Theme</button>
                </div>
            </div>

            <!-- Security Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-shield-halved" style="color: var(--success);"></i> Change Password</h2>
                </div>
                
                <div style="max-width: 400px;">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input id="cur_pass" type="password" class="form-input" placeholder="Enter current password">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input id="new_pass" type="password" class="form-input" placeholder="Enter new password">
                    </div>
                    <button class="btn-primary" onclick="changePassword()"><i class="fa-solid fa-key"></i> Update Password</button>
                    <div id="pw_msg"></div>
                </div>
            </div>

            <!-- Users Admin Panel (Only visible to Admin) -->
            <div class="panel" id="users_panel" style="display:none;">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-users-gear" style="color: #eab308;"></i> User Management</h2>
                    <button class="btn-primary" onclick="toggleAddUser()">
                        <i class="fa-solid fa-plus"></i> New User
                    </button>
                </div>

                <div class="add-form" id="add_user_form">
                    <h3 style="margin-bottom: 16px; font-size: 15px;">Create a New Staff User</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: end; margin-bottom: 16px;">
                        <div class="form-group" style="margin:0;">
                            <label>Username</label>
                            <input id="u_username" class="form-input" placeholder="e.g. jdoe">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label>Password</label>
                            <input id="u_password" type="password" class="form-input" placeholder="••••••••">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label>Role</label>
                            <select id="u_role" class="form-input">
                                <option value="cashier">Cashier</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="addUser()"><i class="fa-solid fa-user-plus"></i> Create User</button>
                    <div id="u_msg"></div>
                </div>

                <div class="table-wrapper">
                    <table id="users_table">
                        <!-- Populated by JS -->
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// --- Ethiopian Calendar Logic ---
function toggleCalendar() {
    const current = localStorage.getItem('calendarType') || 'GC';
    localStorage.setItem('calendarType', current === 'GC' ? 'EC' : 'GC');
    location.reload(); 
}
function getCalendarType() { return localStorage.getItem('calendarType') || 'GC'; }

// --- Theme Logic ---
function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('darkMode', isDark);
    
    const txt = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    document.getElementById('dark_toggle').innerText = txt;
    document.getElementById('dark_toggle_inline').innerText = txt;
}

function loadPreferences() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        const txt = '☀️ Light Mode';
        document.getElementById('dark_toggle').innerText = txt;
        document.getElementById('dark_toggle_inline').innerText = txt;
    }
    const calType = getCalendarType();
    document.getElementById('cal_toggle').innerHTML = calType === 'EC' ? '<i class="fa-solid fa-calendar"></i> EC Mode' : '<i class="fa-solid fa-calendar"></i> GC Mode';
}

// --- API & Auth Logic ---
let myUserId = null;
let myRole = null;

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) { window.location.href = '/login.html'; return false; }
    
    const data = await res.json();
    myUserId = data.userId;
    myRole = data.role;
    
    if (myRole === 'admin') {
        document.getElementById('users_panel').style.display = 'block';
        loadUsers();
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

async function changePassword() {
    const current_password = document.getElementById('cur_pass').value;
    const new_password = document.getElementById('new_pass').value;
    
    if(!current_password || !new_password) return alert("Please fill both password fields.");

    const res = await fetch('/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ current_password, new_password })
    });
    
    const data = await res.json();
    const msg = document.getElementById('pw_msg');
    
    if (res.ok) {
        msg.className = 'msg';
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Password updated successfully';
        document.getElementById('cur_pass').value = '';
        document.getElementById('new_pass').value = '';
    } else {
        msg.className = 'err';
        msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.error;
    }
    
    setTimeout(() => msg.innerHTML = '', 4000);
}

function toggleAddUser() {
    const form = document.getElementById('add_user_form');
    form.style.display = form.style.display === 'none' || form.style.display === '' ? 'block' : 'none';
}

async function addUser() {
    const body = {
        username: document.getElementById('u_username').value,
        password: document.getElementById('u_password').value,
        role: document.getElementById('u_role').value
    };
    
    if(!body.username || !body.password) return alert("Username and Password are required.");

    const res = await fetch('/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const data = await res.json();
    const msg = document.getElementById('u_msg');
    
    if (res.ok) {
        msg.className = 'msg';
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> User created successfully';
        document.getElementById('u_username').value = '';
        document.getElementById('u_password').value = '';
        loadUsers();
    } else {
        msg.className = 'err';
        msg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.error;
    }
    setTimeout(() => msg.innerHTML = '', 4000);
}

async function deleteUser(id) {
    if (!confirm('Are you sure you want to remove this user?')) return;
    const res = await fetch('/users/' + id, { method: 'DELETE' });
    if (res.ok) {
        loadUsers();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to remove user');
    }
}

async function loadUsers() {
    const res = await fetch('/users');
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>Username</th><th>Role</th><th>Created Date</th><th>Action</th></tr>';
    data.forEach(u => {
        const isMe = u.id === myUserId;
        const roleBadge = u.role === 'admin' ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge">Cashier</span>';
        
        html += `<tr>
            <td style="font-weight:600;">${u.username} ${isMe ? '<span style="color:var(--primary); font-size:12px; margin-left:6px;">(You)</span>' : ''}</td>
            <td>${roleBadge}</td>
            <td style="color:var(--text-muted);">${new Date(u.created_at).toLocaleDateString()}</td>
            <td>${isMe ? '-' : `<button class="btn-delete" onclick="deleteUser(${u.id})"><i class="fa-solid fa-trash-can"></i> Remove</button>`}</td>
        </tr>`;
    });
    document.getElementById('users_table').innerHTML = html;
}

(async () => {
    loadPreferences();
    await checkAuth();
})();
</script>
</body>
</html>
