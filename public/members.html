<!DOCTYPE html>
<html>
<head>
    <title>Members - Equb Manager</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a2332;
            --text-muted: #6b7280;
            --border: #e0e4e8;
        }
        body.dark {
            --bg: #12161f;
            --card-bg: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
        }

        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar {
            width: 220px;
            background: #1a2332;
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px 0;
            overflow-y: auto;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 20px;
        }
        .sidebar .logo-icon {
            width: 40px;
            height: 40px;
            background: #2c7be5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: #c5cdd8;
            text-decoration: none;
            font-size: 14px;
            margin: 2px 10px;
            border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .topbar h1 { margin: 0; font-size: 20px; color: var(--text); }
        .topbar .search {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
        }
        .topbar button { width: auto; background: #d64545; padding: 8px 16px; border: none; border-radius: 6px; color: white; cursor: pointer; }

        input, select, button { padding: 8px; margin: 4px 0; box-sizing: border-box; }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid var(--border); padding: 8px; text-align: left; color: var(--text); }
        .msg { color: #1b8a4a; font-size: 14px; }

        .member-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 30px;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; }
        .panel-header button { background: #1e2a3a; padding: 8px 16px; width: auto; }
        #rounds_table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
        #rounds_table th, #rounds_table td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; color: var(--text); }
        #rounds_table th { background: rgba(128,128,128,0.08); }
        #rounds_table td:nth-child(2), #rounds_table th:nth-child(2) { text-align: left; font-weight: bold; }

        .group-bar { margin-bottom:16px; }
        .group-bar label { font-size:13px; color: var(--text-muted); margin-right:8px; }
        .group-bar select { width:auto; display:inline-block; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

        <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html" class="active"><span class="icon">👤</span> Members</a>
            <a href="/payments.html"><span class="icon">💳</span> Payments</a>
            <a href="/daily-collection.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/weekly-collection.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/groups.html"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/reports.html"><span class="icon">📊</span> Reports</a>
            <a href="/export.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="/settings.html"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Members</h1>
            <input class="search" id="search_box" placeholder="Search members..." oninput="filterMembers()">
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="group-bar">
            <label>Viewing group:</label>
            <select id="group_selector" onchange="loadRoundsTable()"></select>
        </div>

        <div class="member-panel">
            <div class="panel-header">
                <h2 style="margin:0;">All Members</h2>
                <button onclick="toggleAddMember()">+ Add Member</button>
            </div>

            <div id="add_member_form" style="display:none; margin: 12px 0;">
                <input id="m_number" placeholder="Member No. (optional, auto if blank)" type="number">
                <input id="m_name" placeholder="Full name">
                <input id="m_phone" placeholder="Phone">
                <select id="m_period">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                </select>
                <select id="m_group"></select>
                <button onclick="addMember()">Save Member</button>
                <div id="m_msg" class="msg"></div>
            </div>

            <div style="overflow-x:auto;">
                <table id="rounds_table"></table>
            </div>
        </div>
    </div>

<script>
function loadDarkModePreference() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }
}

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

function filterMembers() {
    const query = document.getElementById('search_box').value.toLowerCase();
    const rows = document.querySelectorAll('#rounds_table tr');
    rows.forEach((row, index) => {
        if (index === 0) return;
        const nameCell = row.cells[1];
        if (!nameCell) return;
        const name = nameCell.innerText.toLowerCase();
        row.style.display = name.includes(query) ? '' : 'none';
    });
}

function toggleAddMember() {
    const form = document.getElementById('add_member_form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function loadGroupOptions() {
    const res = await fetch('/groups');
    if (!res.ok) return;
    const groups = await res.json();
    const selector = document.getElementById('group_selector');
    const memberGroupSelect = document.getElementById('m_group');
    selector.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    memberGroupSelect.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
}

async function addMember() {
    const body = {
        full_name: document.getElementById('m_name').value,
        phone: document.getElementById('m_phone').value,
        period_type: document.getElementById('m_period').value,
        group_id: document.getElementById('m_group').value,
        group_member_no: document.getElementById('m_number').value || undefined
    };
    const res = await fetch('/members', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const data = await res.json();
    document.getElementById('m_msg').innerText = 'Added: ' + data.full_name + ' (ID: ' + data.id + ')';
    loadRoundsTable();
}

async function loadRoundsTable() {
    const groupId = document.getElementById('group_selector').value;
    const res = await fetch('/members-rounds?group_id=' + groupId);
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>ID</th><th>Name</th><th>Phone</th><th>Group</th>' + data.rounds.map(r => `<th>${r}</th>`).join('') + '<th>Action</th></tr>';
    data.members.forEach(m => {
        html += `<tr>
            <td>${m.group_member_no || '-'}</td>
            <td>${m.full_name}</td>
            <td>${m.phone || '-'}</td>
            <td>${m.group_name || '-'}</td>`;
        data.rounds.forEach(r => {
            const amt = (data.payments[m.id] && data.payments[m.id][r]) || 0;
            html += amt > 0 ? `<td>${amt}</td>` : `<td>-</td>`;
        });
        html += `<td>
            <button onclick="editMember(${m.id}, '${m.full_name.replace(/'/g, "\\'")}', ${m.group_member_no || 'null'})" style="width:auto; background:#2c7be5; padding:4px 10px; font-size:12px;">Edit</button>
            <button onclick="deleteMember(${m.id})" style="width:auto; background:#d64545; padding:4px 10px; font-size:12px;">Remove</button>
        </td>`;
        html += '</tr>';
    });
    document.getElementById('rounds_table').innerHTML = html;
}

async function editMember(id, currentName, currentNo) {
    const newName = prompt('Full name:', currentName);
    if (newName === null) return;
    const newNo = prompt('Member number (leave blank for none):', currentNo || '');
    if (newNo === null) return;

    const res = await fetch('/members/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ full_name: newName, group_member_no: newNo || null })
    });
    if (res.ok) {
        loadRoundsTable();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to update member');
    }
}

async function deleteMember(id) {
    if (!confirm('Remove this member? Their payment history will be kept.')) return;
    const res = await fetch('/members/' + id, { method: 'DELETE' });
    if (res.ok) {
        loadRoundsTable();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to remove member');
    }
}

(async () => {
    loadDarkModePreference();
    const ok = await checkAuth();
    if (ok) {
        await loadGroupOptions();
        loadRoundsTable();
    }
})();
</script>
</body>
</html>
