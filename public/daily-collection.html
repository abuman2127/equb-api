<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Collection - Equb Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --sidebar: #ffffff;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --icon-blue-bg: #dbeafe;
            --font-main: 'Inter', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        body.dark {
            --bg: #12161f;
            --card: #1a2332;
            --sidebar: #1a2332;
            --text: #e5e9f0;
            --text-muted: #9aa4b8;
            --border: #2a3547;
            --icon-blue-bg: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: var(--transition); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        .sidebar { width: 260px; background-color: var(--sidebar); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .brand { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .brand-text { font-weight: 700; font-size: 16px; color: var(--text); }
        .section-label { padding: 24px 24px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: var(--transition); }
        .menu-item i { width: 20px; text-align: center; font-size: 16px; }
        .menu-item:hover { background-color: var(--bg); color: var(--text); }
        .menu-item.active { background-color: var(--icon-blue-bg); color: var(--primary-dark); font-weight: 600; }

        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }

        .header { height: 72px; background-color: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .search-bar { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--radius-sm); width: 300px; transition: var(--transition); }
        .search-bar i { color: var(--text-muted); }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--text); }
        
        .header-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
        .btn-action { border: none; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); transition: var(--transition); }
        .btn-action:hover { filter: brightness(0.95); }
        .btn-logout { background: var(--danger-bg); color: var(--danger); border: none; }
        body.dark .btn-logout { background: #7f1d1d; color: #fca5a5; }

        .container { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center;}
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px 24px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-wrap: wrap; gap: 16px; }
        .date-picker-wrapper { display: flex; align-items: center; gap: 12px; }
        .date-picker-wrapper label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        input[type="date"] { background: var(--bg); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; color-scheme: light dark; font-family: inherit;}
        select.form-input { background: var(--bg); border: 1px solid var(--border); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text); outline: none; font-family: inherit; height: 42px; }

        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .stat-card { background: var(--card); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; align-items: flex-start; gap: 16px; }
        .stat-card .stat-icon { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .stat-icon.green { background: var(--success-bg); color: var(--success); }
        .stat-icon.blue { background: var(--icon-blue-bg); color: var(--primary); }
        .stat-icon.red { background: var(--danger-bg); color: var(--danger); }
        .stat-card .label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--text); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); }
        .panel-header { margin-bottom: 20px; }
        .panel-header h2 { margin: 0; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 8px;}
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        td { font-size: 14px; font-weight: 500; color: var(--text); }
        
        .badge-paid { background: var(--success-bg); color: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .badge-unpaid { background: var(--danger-bg); color: var(--danger); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }

        .ec-calendar-wrapper { position: relative; min-width: 240px; display: none; }
        .ec-calendar-input {
            background: var(--bg); border: 1px solid var(--border); padding: 10px 16px; height: 42px;
            border-radius: var(--radius-sm); font-size: 14px; color: var(--text); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ec-popup {
            position: absolute; top: calc(100% + 4px); right: 0; width: 280px;
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 1000; padding: 16px; display: none;
        }
        .ec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--text); font-weight: 600; font-size: 15px;}
        .ec-header button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
        .ec-header button:hover { background: var(--bg); color: var(--text); }
        .ec-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .ec-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .ec-day { padding: 6px 0; font-size: 13px; color: var(--text); border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: 500;}
        .ec-day:hover:not(:empty) { background: var(--border); }
        .ec-day.selected { background: var(--primary); color: white; font-weight: 700;}
        .ec-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .ec-footer button { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px; }

        .mobile-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 0; margin-right: 12px; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 95; backdrop-filter: blur(2px); }
        .sidebar-overlay.show { display: block; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 16px !important; width: 100%; }
            .mobile-toggle { display: inline-block; }
            
            .header { flex-direction: column; align-items: flex-start; gap: 16px; height: auto !important; padding: 16px !important; }
            .header-left, .header-right { width: 100%; justify-content: flex-start; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;}
            .header-left { display: flex; align-items: center; }
            .search-bar { width: 100% !important; flex: 1; }
            
            .toolbar, .filter-group { flex-direction: column; align-items: stretch !important; gap: 12px; width: 100%;}
            .date-picker-wrapper { width: 100%; }
            .date-picker-wrapper > div { width: 100%; }
            input[type="date"], .ec-calendar-wrapper { width: 100% !important; }
            .btn-action, .btn-logout { width: 100%; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar_overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">EQUB MGT</div>
        </div>

        <div class="section-label">MAIN</div>
        <div class="sidebar-menu">
            <a href="/index.html" class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</a>

            <a href="/winners.html" class="menu-item"><i class="fa-solid fa-trophy"></i> Payouts (Winners)</a>
            <a href="/reports.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            <a href="/export.html" class="menu-item"><i class="fa-solid fa-file-export"></i> Export</a>
        </div>

        <div class="section-label">OTHERS</div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fa-solid fa-bell"></i> Notifications</a>
            <a href="/settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>

    <div class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>

        <div class="container">
            <h1 class="page-title">Daily Collection Overview</h1>

            <div class="toolbar">
                <div style="width: 100%; max-width: 220px;">
                    <label style="font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:6px; display:block;"><i class="fa-solid fa-users-rectangle"></i> Group</label>
                    <select id="group_selector" class="form-input" onchange="loadCollection()">
                        <option value="">All Groups</option>
                    </select>

                <div class="date-picker-wrapper" style="align-items: flex-end;">

                            <label style="font-size:13px; font-weight:600; color:var(--text-muted);"><i class="fa-solid fa-calendar-day"></i> Select Date (<span id="date_mode_label">GC</span>)</label>
                            <button type="button" onclick="toggleInputMode(event)" style="background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; padding: 0;">Switch to EC</button>

                        <input id="date_picker_gc" type="date" class="form-input" onchange="syncGcToBackend()" style="height: 42px; width: 100%;">

                            <div class="ec-calendar-input" onclick="toggleEcPopup()">
                                <span id="ec_display_text">MM/DD/YYYY</span>

                            </div>
                            
                            <div class="ec-popup" id="ec_popup">
                                <div class="ec-header">
                                    <button onclick="changeEcMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>

                    <table id="collection_table"></table>

<script>
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebar_overlay').classList.toggle('show');
}

const ETHIOPIAN_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];

function gregorianToEthiopian(gDate) {
    const jdn = Math.floor((gDate.getTime() / 86400000) + 2440587.5 + 0.5);
    const ethEpoch = 1723856;
    const r = (jdn - ethEpoch) % 1461;
    const n = (r % 365) + 365 * Math.floor(r / 1460);
    const eYear = 4 * Math.floor((jdn - ethEpoch) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
    const eMonth = Math.floor(n / 30) + 1;
    const eDay = (n % 30) + 1;
    return { year: eYear, month: eMonth, day: eDay, monthName: ETHIOPIAN_MONTHS[eMonth - 1] };
}

function ethiopianToGregorian(eYear, eMonth, eDay) {
    const baseGC = new Date(Date.UTC(2007, 8, 12)); 
    let daysToCurrent = 0;
    for (let y = 2000; y < eYear; y++) { daysToCurrent += ((y + 1) % 4 === 0) ? 366 : 365; }
    for (let m = 1; m < eMonth; m++) { daysToCurrent += 30; }
    daysToCurrent += (eDay - 1);
    return new Date(baseGC.getTime() + (daysToCurrent * 86400000));
}

let currentInputMode = 'GC';
let viewEcYear, viewEcMonth;
let selectedEcDate = null; 

function toggleInputMode(event) {
    currentInputMode = currentInputMode === 'GC' ? 'EC' : 'GC';
    document.getElementById('date_mode_label').innerText = currentInputMode;
    event.target.innerText = currentInputMode === 'GC' ? 'Switch to EC' : 'Switch to GC';
    
    if (currentInputMode === 'EC') {
        document.getElementById('date_picker_gc').style.display = 'none';
        document.getElementById('ec_wrapper').style.display = 'block';
        if (!selectedEcDate) setEcToday(); 
    } else {
        document.getElementById('date_picker_gc').style.display = 'block';
        document.getElementById('ec_wrapper').style.display = 'none';
        syncGcToBackend();
    }
}

function syncGcToBackend() {
    document.getElementById('date_picker').value = document.getElementById('date_picker_gc').value;
    loadCollection();
}

function toggleEcPopup() {
    const popup = document.getElementById('ec_popup');
    popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
    renderEcGrid();
}

document.addEventListener('click', function(e) {
    const wrapper = document.getElementById('ec_wrapper');
    const popup = document.getElementById('ec_popup');
    if (wrapper && !wrapper.contains(e.target)) popup.style.display = 'none';
});

function setEcToday() {
    const ecToday = gregorianToEthiopian(new Date());
    viewEcYear = ecToday.year;
    viewEcMonth = ecToday.month;
    selectedEcDate = { year: ecToday.year, month: ecToday.month, day: ecToday.day };
    updateEcInputText();
    renderEcGrid();
    document.getElementById('ec_popup').style.display = 'none';
}

function clearEcDate() {
    selectedEcDate = null;
    document.getElementById('ec_display_text').innerText = 'Select Date...';
    document.getElementById('date_picker').value = '';
    document.getElementById('ec_popup').style.display = 'none';
    renderEcGrid();
    loadCollection();
}

function changeEcMonth(delta) {
    viewEcMonth += delta;
    if (viewEcMonth > 13) { viewEcMonth = 1; viewEcYear++; }
    if (viewEcMonth < 1) { viewEcMonth = 13; viewEcYear--; }
    renderEcGrid();
}

function selectEcDay(day) {
    selectedEcDate = { year: viewEcYear, month: viewEcMonth, day: day };
    updateEcInputText();
    document.getElementById('ec_popup').style.display = 'none';
}

function updateEcInputText() {
    if(!selectedEcDate) return;
    document.getElementById('ec_display_text').innerText = `${String(selectedEcDate.month).padStart(2,'0')}/${String(selectedEcDate.day).padStart(2,'0')}/${selectedEcDate.year}`;
    const gDate = ethiopianToGregorian(selectedEcDate.year, selectedEcDate.month, selectedEcDate.day);
    document.getElementById('date_picker').value = gDate.toISOString().split('T')[0];
    loadCollection();
}

function renderEcGrid() {
    document.getElementById('ec_month_year').innerText = `${ETHIOPIAN_MONTHS[viewEcMonth - 1]} ${viewEcYear}`;
    
    const gDateFirst = ethiopianToGregorian(viewEcYear, viewEcMonth, 1);
    const startDay = gDateFirst.getDay(); 
    
    const daysInMonth = viewEcMonth === 13 ? (((viewEcYear + 1) % 4 === 0) ? 6 : 5) : 30;
    
    let html = '';
    for(let i=0; i<startDay; i++) html += `<div class="ec-day empty"></div>`;
    
    for(let d=1; d<=daysInMonth; d++) {
        let isSel = selectedEcDate && selectedEcDate.year === viewEcYear && selectedEcDate.month === viewEcMonth && selectedEcDate.day === d;
        html += `<div class="ec-day ${isSel ? 'selected' : ''}" onclick="selectEcDay(${d})">${d}</div>`;
    }
    document.getElementById('ec_days_grid').innerHTML = html;
}

function toggleCalendar() {
    const current = localStorage.getItem('calendarType') || 'GC';
    localStorage.setItem('calendarType', current === 'GC' ? 'EC' : 'GC');
    location.reload(); 
}
function getCalendarType() { return localStorage.getItem('calendarType') || 'GC'; }

function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark_toggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function loadPreferences() {
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('dark_toggle').innerText = '☀️ Light Mode';
    }
    const calType = getCalendarType();
    document.getElementById('cal_toggle').innerHTML = calType === 'EC' ? '<i class="fa-solid fa-calendar"></i> EC Mode' : '<i class="fa-solid fa-calendar"></i> GC Mode';
}

function filterMembers() {
    const query = document.getElementById('search_box').value.toLowerCase();
    const rows = document.querySelectorAll('#collection_table tr');
    rows.forEach((row, index) => {
        if (index === 0) return;
        const nameCell = row.cells[0];
        if (!nameCell) return;
        const name = nameCell.innerText.toLowerCase();
        row.style.display = name.includes(query) ? '' : 'none';
    });
}

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) { window.location.href = '/login.html'; return false; }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

async function loadGroupOptions() {
    const res = await fetch('/groups');
    if (!res.ok) return;
    const groups = await res.json();
    const selector = document.getElementById('group_selector');
    selector.innerHTML = '<option value="">All Groups</option>' +
        groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
}

async function loadCollection() {
    const dateVal = document.getElementById('date_picker').value;
    const groupId = document.getElementById('group_selector').value;
    let url = '/daily-collection?';
    if (dateVal) url += `date=${dateVal}&`;
    if (groupId) url += `group_id=${groupId}`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();

    document.getElementById('stat_total').innerText = data.total_collected.toLocaleString() + ' Birr';
    document.getElementById('stat_paid').innerText = data.paid_count;
    document.getElementById('stat_unpaid').innerText = data.unpaid_count;

    let html = '<tr><th>Member Name</th><th>Phone</th><th>Period Type</th><th>Amount Paid</th><th>Status</th></tr>';
    
    if (data.members.length === 0) {
        html += `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted);">No data available for this date.</td></tr>`;
    } else {
        data.members.forEach(m => {
            const badge = m.status === 'paid'
                ? `<span class="badge-paid"><i class="fa-solid fa-check"></i> Paid</span>`
                : `<span class="badge-unpaid"><i class="fa-solid fa-xmark"></i> Not Paid</span>`;
                
            html += `<tr>
                <td style="font-weight: 600; color: var(--text);"><a href="/member-detail.html?id=${m.id}" style="color: var(--primary); text-decoration: none;">${m.full_name}</a></td>
                <td style="color: var(--text-muted);">${m.phone || '-'}</td>
                <td><span style="background: var(--bg); padding:4px 8px; border-radius:6px; font-size:12px; border:1px solid var(--border);">${m.period_type}</span></td>
                <td style="color: var(--success); font-weight: 700;">${m.paid_today ? m.paid_today.toLocaleString() + ' Birr' : '-'}</td>
                <td>${badge}</td>
            </tr>`;
        });
    }
    document.getElementById('collection_table').innerHTML = html;
}

(async () => {
    loadPreferences();
    const ok = await checkAuth();
    if (ok) {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('date_picker_gc').value = todayStr;
        document.getElementById('date_picker').value = todayStr;
        await loadGroupOptions();
        loadCollection();
    }
})();
</script>
