<!DOCTYPE html>
<html>
<head>
    <title>Settings - Equb Manager</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; display: flex; }

        .sidebar {
            width: 220px; background: #1a2332; color: white; height: 100vh;
            position: fixed; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .logo { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; }
        .sidebar .logo-icon {
            width: 40px; height: 40px; background: #2c7be5; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
        }
        .sidebar .logo-text { font-weight: bold; font-size: 16px; line-height: 1.3; }
        .sidebar .logo-text span { display: block; font-size: 10px; font-weight: normal; color: #8b95a5; letter-spacing: 0.5px; }
        .sidebar .section-label { padding: 16px 20px 6px; font-size: 11px; color: #6b7590; letter-spacing: 1px; }
        .sidebar nav { margin-top: 4px; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            color: #c5cdd8; text-decoration: none; font-size: 14px; margin: 2px 10px; border-radius: 8px;
        }
        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar a.active { background: #2c7be5; color: white; }
        .sidebar a:hover { background: #2a3547; }

        .main-content { margin-left: 220px; padding: 24px; width: 100%; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .topbar h1 { margin: 0; font-size: 20px; color: #1a2332; }
        .topbar button {
            width: auto; background: #d64545; padding: 8px 16px; border: none;
            border-radius: 6px; color: white; cursor: pointer;
        }

        input, select, button { padding: 8px; margin: 4px 0; box-sizing: border-box; }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .msg { color: green; font-size: 14px; }
        .err { color: #b02a2a; font-size: 14px; }

        .panel { background: white; border: 1px solid #e0e4e8; border-radius: 8px; padding: 16px; margin-bottom: 30px; max-width: 500px; }
        .panel h2 { margin-top: 0; }
        .panel-wide { max-width: none; }

        .panel-header { display: flex; justify-content: space-between; align-items: center; }
        .panel-header button { background: #1e2a3a; padding: 8px 16px; width: auto; }

        .badge { background: #eef2f7; color: #1a2332; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">👥</div>
            <div class="logo-text">EKUBE<span>MANAGEMENT SYSTEM</span></div>
        </div>

                <div class="section-label">MAIN</div>
        <nav>
            <a href="/index.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="/members.html"><span class="icon">👤</span> Members</a>
            <a href="/payments.html"><span class="icon">💳</span> Payments</a>
            <a href="/daily-collection.html"><span class="icon">📅</span> Daily Collection</a>
            <a href="/weekly-collection.html"><span class="icon">🗓️</span> Weekly Collection</a>
            <a href="/groups.html"><span class="icon">👥</span> Groups (Equb)</a>
            <a href="/reports.html"><span class="icon">📊</span> Reports</a>
            <a href="/export.html"><span class="icon">📤</span> Export</a>
        </nav>

        <div class="section-label">OTHERS</div>
        <nav>
            <a href="#"><span class="icon">🔔</span> Notifications</a>
            <a href="/settings.html"><span class="icon">⚙️</span> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Settings</h1>
            <button onclick="logout()">Log Out</button>
        </div>

        <div class="panel">
            <h2>Change Password</h2>
            <input id="cur_pass" type="password" placeholder="Current password">
            <input id="new_pass" type="password" placeholder="New password">
            <button onclick="changePassword()">Update Password</button>
            <div id="pw_msg"></div>
        </div>

        <div class="panel panel-wide" id="users_panel" style="display:none;">
            <div class="panel-header">
                <h2 style="margin:0;">Users</h2>
                <button onclick="toggleAddUser()">+ New User</button>
            </div>

            <div id="add_user_form" style="display:none; margin: 12px 0; max-width:400px;">
                <input id="u_username" placeholder="Username">
                <input id="u_password" type="password" placeholder="Password">
                <select id="u_role">
                    <option value="cashier">Cashier</option>
                    <option value="admin">Admin</option>
                </select>
                <button onclick="addUser()">Create User</button>
                <div id="u_msg"></div>
            </div>

            <table id="users_table"></table>
        </div>
    </div>

<script>
let myUserId = null;
let myRole = null;

async function checkAuth() {
    const res = await fetch('/me');
    if (!res.ok) {
        window.location.href = '/login.html';
        return false;
    }
    const data = await res.json();
    myUserId = data.userId;
    myRole = data.role;
    if (myRole === 'admin') {
        document.getElementById('users_panel').style.display = 'block';
        loadUsers();
    }
    return true;
}

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

async function changePassword() {
    const current_password = document.getElementById('cur_pass').value;
    const new_password = document.getElementById('new_pass').value;
    const res = await fetch('/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ current_password, new_password })
    });
    const data = await res.json();
    const msg = document.getElementById('pw_msg');
    if (res.ok) {
        msg.className = 'msg';
        msg.innerText = 'Password updated successfully';
        document.getElementById('cur_pass').value = '';
        document.getElementById('new_pass').value = '';
    } else {
        msg.className = 'err';
        msg.innerText = data.error;
    }
}

function toggleAddUser() {
    const form = document.getElementById('add_user_form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function addUser() {
    const body = {
        username: document.getElementById('u_username').value,
        password: document.getElementById('u_password').value,
        role: document.getElementById('u_role').value
    };
    const res = await fetch('/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });
    const data = await res.json();
    const msg = document.getElementById('u_msg');
    if (res.ok) {
        msg.className = 'msg';
        msg.innerText = 'User created';
        loadUsers();
    } else {
        msg.className = 'err';
        msg.innerText = data.error;
    }
}

async function deleteUser(id) {
    if (!confirm('Remove this user?')) return;
    const res = await fetch('/users/' + id, { method: 'DELETE' });
    if (res.ok) {
        loadUsers();
    } else {
        const data = await res.json();
        alert(data.error || 'Failed to remove user');
    }
}

async function loadUsers() {
    const res = await fetch('/users');
    if (!res.ok) return;
    const data = await res.json();

    let html = '<tr><th>Username</th><th>Role</th><th>Created</th><th>Action</th></tr>';
    data.forEach(u => {
        const isMe = u.id === myUserId;
        html += `<tr>
            <td>${u.username}${isMe ? ' (you)' : ''}</td>
            <td><span class="badge">${u.role}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>${isMe ? '-' : `<button onclick="deleteUser(${u.id})" style="width:auto; background:#d64545; padding:4px 10px; font-size:12px;">Remove</button>`}</td>
        </tr>`;
    });
    document.getElementById('users_table').innerHTML = html;
}

checkAuth();
</script>
</body>
</html>
