<!DOCTYPE html>
<html>
<head>
    <title>Equb Manager - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 32px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .login-box h2 { margin-top: 0; text-align: center; color: #1e2a3a; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }
        .error { color: red; font-size: 13px; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Equb Manager</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <div id="error" class="error"></div>
    </div>

<script>
async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    if (res.ok) {
        window.location.href = '/index.html';
    } else {
        const data = await res.json();
        document.getElementById('error').innerText = data.error || 'Login failed';
    }
}

document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
});
</script>
</body>
</html>
